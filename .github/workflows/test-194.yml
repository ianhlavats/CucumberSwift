# Throwaway test for cucumberswift/CucumberSwift#194. Fork only; never merged.
# The build job's steps are copied verbatim from release.yml (docs-build).
name: Test 194
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [negative, positive]
permissions: {}
env: {"DOCC_TARGET":"CucumberSwift","DOCS_PATH":"CucumberSwift"}
jobs:
  negative:
    if: ${{ inputs.mode == 'negative' }}
    permissions: {contents: read, pages: write, id-token: write}
    uses: ./.github/workflows/docs.yml
    with: {version: "5.0.14", latest: "true"}
  docs-build:
    if: ${{ inputs.mode == 'positive' }}
    runs-on: macos-14
    timeout-minutes: 30
    permissions: {"contents":"read"}
    env: {"VERSION": "5.0.15"}
    steps: [{"uses":"actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1","with":{"ref":"${{ github.sha }}","persist-credentials":false}},{"name":"Show the version on the landing page","run":"page=\"Sources/$DOCC_TARGET/$DOCC_TARGET.docc/$DOCC_TARGET.md\"\nif [ \"$(head -n 1 \"$page\")\" != \"# \\`\\`$DOCC_TARGET\\`\\`\" ] || grep -q '@Metadata' \"$page\"; then\n  echo \"::error::$page must start with its title and have no @Metadata.\"\n  exit 1\nfi\n{ head -n 1 \"$page\"\n  printf '\\n@Metadata {\\n    @TitleHeading(\"Version %s\")\\n}\\n' \"$VERSION\"\n  tail -n +2 \"$page\"\n} > \"$RUNNER_TEMP/landing.md\"\nmv \"$RUNNER_TEMP/landing.md\" \"$page\"\n"},{"name":"Generate DocC static sites","run":"build() {\n  swift package --allow-writing-to-directory \"$2\" \\\n    generate-documentation --target \"$DOCC_TARGET\" \\\n    --disable-indexing \\\n    --transform-for-static-hosting \\\n    --hosting-base-path \"$1\" \\\n    --output-path \"$2\"\n  (cd \"$2\" && zip -qr \"$GITHUB_WORKSPACE/$3\" .)\n}\nbuild \"$DOCS_PATH/${VERSION%%.*}.x\" docs-major docs-major.zip\nbuild \"$DOCS_PATH\" docs-root docs-root.zip\n"},{"uses":"actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a","with":{"name":"docs","path":"docs-major.zip\ndocs-root.zip\n","if-no-files-found":"error","retention-days":1}}]
  release:
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: docs}
      - env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        run: gh release create 5.0.15 --target "$GITHUB_SHA" --title 5.0.15 --notes "Test release for CucumberSwift issue 194." --latest docs-major.zip docs-root.zip
  docs:
    needs: release
    permissions: {contents: read, pages: write, id-token: write}
    uses: ./.github/workflows/docs.yml
    with: {version: "5.0.15", latest: "true"}
